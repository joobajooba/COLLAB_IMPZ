<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walk</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141820;
      overflow: hidden;
    }
    canvas { display: block; }
    :root {
      --panel: #1b6d94;
      --panel-deep: #14567a;
      --ink: #f4f8fb;
      --line: rgba(8, 32, 48, 0.55);
    }
    #shell {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: var(--ink);
      font: 13px/1.3 system-ui, sans-serif;
      user-select: none;
    }
    #shell button,
    #shell input,
    #emotes,
    #skins,
    .card,
    .stat,
    .profile,
    .slot {
      pointer-events: auto;
    }
    .chip,
    .slot,
    .profile,
    .stat,
    #chat {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
    }
    .chip,
    .icon-btn,
    .slot,
    #chat,
    .card,
    #emotes,
    #skins {
      border-radius: 8px;
    }
    .top-left {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .right-col {
      position: absolute;
      top: 14px;
      right: 14px;
      bottom: 16px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-right {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .row { display: flex; gap: 8px; }
    .chip,
    .icon-btn {
      color: inherit;
      font: 600 13px/1 system-ui, sans-serif;
      background: var(--panel);
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .chip { padding: 8px 12px; }
    .chip:hover,
    .icon-btn:hover,
    .slot:hover { background: #2180ad; }
    .slots { display: flex; gap: 8px; }
    .slot {
      box-sizing: border-box;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      margin: 0;
      padding: 8px;
      appearance: none;
      line-height: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .slot img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .stats { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .stat {
      min-width: 148px;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .stat .label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .coins { font: 700 16px/1 system-ui, sans-serif; }
    .coins i {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border-radius: 50%;
      background: #f0c14a;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
      vertical-align: -1px;
    }
    .meter {
      height: 8px;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }
    .meter span {
      display: block;
      width: 100%;
      height: 100%;
      background: #8fd18a;
    }
    .profile {
      box-sizing: border-box;
      width: 74px;
      flex: 0 0 74px;
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .profile svg { width: 46px; height: 46px; }
    #chat {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 10px;
      pointer-events: auto;
    }
    #chat.collapsed { flex: 0 0 auto; }
    #chat.collapsed .chat-body,
    #chat.collapsed #chat-menu { display: none; }
    #chat.collapsed #chat-collapse svg { transform: rotate(180deg); }
    .chat-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-head h2 {
      margin: 0;
      flex: 1;
      font: 600 15px/1 system-ui, sans-serif;
    }
    .icon-btn {
      width: 28px;
      height: 26px;
      padding: 0;
      display: grid;
      place-items: center;
      background: #d7e3ea;
      color: #16384c;
    }
    .icon-btn svg { width: 15px; height: 15px; }
    .chat-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      flex: 1;
      margin-top: 10px;
    }
    #chat-menu {
      display: flex;
      justify-content: flex-end;
    }
    #chat-menu.hidden { display: none; }
    #chat-clear {
      padding: 4px 8px;
      color: #16384c;
      font: 600 12px system-ui, sans-serif;
      background: #d7e3ea;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #chat-log {
      flex: 1;
      margin: 0;
      padding: 10px;
      overflow: auto;
      border-radius: 12px;
      background: rgba(10, 28, 40, 0.28);
    }
    #chat-log p { margin: 0 0 8px; }
    #chat-log b { font-weight: 700; }
    #chat-log .empty { opacity: 0.7; }
    #chat-form { display: flex; gap: 6px; }
    #chat-input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      color: var(--ink);
      font: inherit;
      background: rgba(10, 28, 40, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
    }
    #chat-form button {
      padding: 8px 10px;
      color: #16384c;
      font: 600 12px system-ui, sans-serif;
      background: #d7e3ea;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .card {
      position: absolute;
      top: 52px;
      left: 14px;
      width: 230px;
      padding: 12px;
      color: var(--ink);
      background: rgba(16, 40, 56, 0.94);
      border: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
    }
    .card.hidden { display: none; }
    .card h3 { margin: 0 0 8px; font-size: 14px; }
    .card p,
    .card li { margin: 0; font-size: 13px; line-height: 1.45; }
    .card ul { margin: 0; padding-left: 16px; }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #e7edf5;
      font: 16px system-ui, sans-serif;
      pointer-events: none;
    }
    #status.hidden { display: none; }
    #emotes {
      position: fixed;
      left: 14px;
      bottom: 16px;
      width: 250px;
      color: var(--ink);
      font: 13px/1.3 system-ui, sans-serif;
      background: rgba(16, 40, 56, 0.94);
      border: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
      padding: 10px;
      border-radius: 8px;
      user-select: none;
    }
    #emotes.hidden { display: none; }
    #skins { background: none; border: 0; box-shadow: none; padding: 0; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgba(6, 12, 18, 0.45);
      pointer-events: auto;
    }
    .modal.hidden { display: none; }
    .modal-card {
      width: min(440px, calc(100vw - 48px));
      min-height: 240px;
      padding: 16px;
      color: var(--ink);
      background: rgba(16, 40, 56, 0.96);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .modal-head h2 { margin: 0; font: 600 16px/1 system-ui, sans-serif; }
    #modal-close {
      width: 28px;
      height: 28px;
      color: #16384c;
      font: 600 18px/1 system-ui, sans-serif;
      background: #d7e3ea;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .modal-pane { display: none; min-height: 160px; }
    .modal-pane.open { display: block; }
    .inv-label {
      margin: 14px 2px 8px;
      font-weight: 600;
    }
    #emotes .title,
    #skins .title {
      display: flex;
      justify-content: space-between;
      margin: 0 2px 8px;
      font-weight: 600;
    }
    #emotes kbd,
    #skins kbd { font: 11px system-ui, sans-serif; opacity: 0.65; }
    #emotes .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    #skins .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    #emotes button,
    #skins button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      color: inherit;
      font: inherit;
      text-align: left;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      cursor: pointer;
    }
    #skins button {
      flex-direction: column;
      gap: 2px;
      padding: 6px 4px;
    }
    #emotes button:hover,
    #skins button:hover { background: rgba(255, 255, 255, 0.16); }
    #emotes button.active,
    #skins button.active {
      background: rgba(143, 209, 138, 0.28);
      border-color: rgba(143, 209, 138, 0.8);
    }
    #emotes .icon { font-size: 16px; }
    #emotes kbd { margin-left: auto; }
    #skins img {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
    }
    #prompt {
      position: fixed;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      color: #e7edf5;
      font: 15px system-ui, sans-serif;
      background: rgba(10, 12, 18, 0.7);
      padding: 8px 14px;
      border-radius: 10px;
      pointer-events: none;
    }
    #prompt.hidden { display: none; }
    #prompt kbd {
      display: inline-block;
      margin-right: 6px;
      padding: 1px 7px;
      font: 600 13px system-ui, sans-serif;
      border: 1px solid rgba(231, 237, 245, 0.6);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="status">Loading character…</div>
  <div id="shell">
    <div class="top-left">
      <div class="row">
        <button class="chip" id="settings-btn" type="button">Settings</button>
        <button class="chip" id="support-btn" type="button">Support</button>
      </div>
      <div class="slots" aria-label="Inventory">
        <button class="slot" id="slot-pick" type="button" title="Inventory (I)">
          <img class="pick-icon" alt="" hidden>
        </button>
        <button class="slot" type="button" tabindex="-1"></button>
        <button class="slot" type="button" tabindex="-1"></button>
        <button class="slot" type="button" tabindex="-1"></button>
        <button class="slot" type="button" tabindex="-1"></button>
      </div>
    </div>
    <div class="right-col">
    <div class="top-right">
      <div class="stats">
        <div class="stat">
          <span class="label">Coins</span>
          <div class="coins"><i></i>0</div>
        </div>
        <div class="stat">
          <span class="label">Energy</span>
          <div class="meter" aria-label="Energy full"><span></span></div>
        </div>
      </div>
      <div class="profile" title="Profile">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#d7e3ea"/>
          <circle cx="32" cy="28" r="12" fill="#7d8b86"/>
          <path d="M14 54c4-10 12-14 18-14s14 4 18 14" fill="#7d8b86"/>
          <path d="M20 16l6 10M44 16l-6 10" stroke="#f4f1ea" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <section id="chat">
      <div class="chat-head">
        <h2>Global Chat</h2>
        <button class="icon-btn" id="chat-settings" type="button" title="Chat settings" aria-label="Chat settings">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="8" cy="8" r="2.2"/>
            <path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"/>
          </svg>
        </button>
        <button class="icon-btn" id="chat-collapse" type="button" title="Collapse chat" aria-label="Collapse chat">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 6l5 5 5-5"/>
          </svg>
        </button>
      </div>
      <div class="chat-body">
        <div id="chat-log">
          <p class="empty">No messages yet.</p>
        </div>
        <form id="chat-form">
          <input id="chat-input" type="text" maxlength="160" placeholder="Message" autocomplete="off">
          <button type="submit">Send</button>
        </form>
      </div>
    </section>
    </div>
  </div>
  <div id="modal" class="modal hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title">Settings</h2>
        <button id="modal-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="modal-pane" data-pane="settings"></div>
      <div class="modal-pane" data-pane="chat"></div>
      <div class="modal-pane" data-pane="inventory">
        <div class="slots" aria-label="Inventory">
          <div class="slot"><img class="pick-icon" alt="" hidden></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
        <div class="inv-label">Pickaxe</div>
        <div id="skins"><div class="grid"></div></div>
      </div>
    </div>
  </div>
  <div id="support-card" class="card hidden">
    <h3>Support</h3>
    <p>This is a local test build. Questions stay with the people sharing this project.</p>
  </div>
  <div id="prompt" class="hidden"><kbd>F</kbd>Mine rock</div>
  <div id="emotes" class="hidden">
    <div class="title"><span>Emotes</span><kbd>E to close</kbd></div>
    <div class="grid"></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
