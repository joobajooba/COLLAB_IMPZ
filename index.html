<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walk</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141820;
      overflow: hidden;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: #e7edf5;
      font: 14px/1.45 system-ui, sans-serif;
      background: rgba(10, 12, 18, 0.55);
      padding: 10px 12px;
      border-radius: 10px;
      pointer-events: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #e7edf5;
      font: 16px system-ui, sans-serif;
      pointer-events: none;
    }
    #status.hidden { display: none; }
    #emotes {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 220px;
      color: #e7edf5;
      font: 13px/1.3 system-ui, sans-serif;
      background: rgba(10, 12, 18, 0.55);
      padding: 10px;
      border-radius: 10px;
      user-select: none;
    }
    #emotes .title {
      display: flex;
      justify-content: space-between;
      margin: 0 2px 8px;
      font-weight: 600;
    }
    #emotes.collapsed .grid { display: none; }
    #emotes.collapsed .title { margin-bottom: 0; }
    #emotes .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    #emotes button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      color: inherit;
      font: inherit;
      text-align: left;
      background: rgba(147, 166, 192, 0.14);
      border: 1px solid rgba(147, 166, 192, 0.22);
      border-radius: 8px;
      cursor: pointer;
    }
    #emotes button:hover { background: rgba(147, 166, 192, 0.26); }
    #emotes button.active {
      background: rgba(122, 200, 120, 0.3);
      border-color: rgba(150, 225, 140, 0.7);
    }
    #emotes .icon { font-size: 16px; }
    #emotes kbd {
      margin-left: auto;
      font: 11px system-ui, sans-serif;
      opacity: 0.6;
    }
    #skins {
      position: fixed;
      right: 16px;
      top: 16px;
      width: 220px;
      color: #e7edf5;
      font: 13px/1.3 system-ui, sans-serif;
      background: rgba(10, 12, 18, 0.55);
      padding: 10px;
      border-radius: 10px;
      user-select: none;
    }
    #skins.hidden { display: none; }
    #skins .title {
      display: flex;
      justify-content: space-between;
      margin: 0 2px 8px;
      font-weight: 600;
    }
    #skins kbd { font: 11px system-ui, sans-serif; opacity: 0.6; }
    #skins .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    #skins button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      color: inherit;
      font: inherit;
      background: rgba(147, 166, 192, 0.14);
      border: 1px solid rgba(147, 166, 192, 0.22);
      border-radius: 8px;
      cursor: pointer;
    }
    #skins button:hover { background: rgba(147, 166, 192, 0.26); }
    #skins button.active {
      background: rgba(122, 200, 120, 0.3);
      border-color: rgba(150, 225, 140, 0.7);
    }
    #skins img {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
    }
    #prompt {
      position: fixed;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      color: #e7edf5;
      font: 15px system-ui, sans-serif;
      background: rgba(10, 12, 18, 0.7);
      padding: 8px 14px;
      border-radius: 10px;
      pointer-events: none;
    }
    #prompt.hidden { display: none; }
    #prompt kbd {
      display: inline-block;
      margin-right: 6px;
      padding: 1px 7px;
      font: 600 13px system-ui, sans-serif;
      border: 1px solid rgba(231, 237, 245, 0.6);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="status">Loading character…</div>
  <div id="hud">WASD to walk · Space to jump<br>Drag to look · scroll to zoom<br>F to mine a rock · Q to change pickaxe</div>
  <div id="prompt" class="hidden"><kbd>F</kbd>Mine rock</div>
  <div id="skins" class="hidden">
    <div class="title"><span>Pickaxe</span><kbd>Q to change</kbd></div>
    <div class="grid"></div>
  </div>
  <div id="emotes">
    <div class="title"><span>Emotes</span><kbd>E to hide</kbd></div>
    <div class="grid"></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
