<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walk</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141820;
      overflow: hidden;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: #e7edf5;
      font: 14px/1.45 system-ui, sans-serif;
      background: rgba(10, 12, 18, 0.55);
      padding: 10px 12px;
      border-radius: 10px;
      pointer-events: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #e7edf5;
      font: 16px system-ui, sans-serif;
      pointer-events: none;
    }
    #status.hidden { display: none; }
    #emotes {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 220px;
      color: #e7edf5;
      font: 13px/1.3 system-ui, sans-serif;
      background: rgba(10, 12, 18, 0.55);
      padding: 10px;
      border-radius: 10px;
      user-select: none;
    }
    #emotes .title {
      display: flex;
      justify-content: space-between;
      margin: 0 2px 8px;
      font-weight: 600;
    }
    #emotes.collapsed .grid { display: none; }
    #emotes.collapsed .title { margin-bottom: 0; }
    #emotes .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    #emotes button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      color: inherit;
      font: inherit;
      text-align: left;
      background: rgba(147, 166, 192, 0.14);
      border: 1px solid rgba(147, 166, 192, 0.22);
      border-radius: 8px;
      cursor: pointer;
    }
    #emotes button:hover { background: rgba(147, 166, 192, 0.26); }
    #emotes button.active {
      background: rgba(122, 200, 120, 0.3);
      border-color: rgba(150, 225, 140, 0.7);
    }
    #emotes .icon { font-size: 16px; }
    #emotes kbd {
      margin-left: auto;
      font: 11px system-ui, sans-serif;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="status">Loading character…</div>
  <div id="hud">WASD to walk · Space to jump<br>Drag to look · scroll to zoom</div>
  <div id="emotes">
    <div class="title"><span>Emotes</span><kbd>E to hide</kbd></div>
    <div class="grid"></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
